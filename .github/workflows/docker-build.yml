name: Docker Build Test

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 8 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t mi-prueba-docker .